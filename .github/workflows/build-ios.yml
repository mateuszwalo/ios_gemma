# GitHub Actions workflow for building GemmaRAG iOS app.
#
# Produces an unsigned .ipa that can be signed locally
# with Sideloadly on Windows using a free Apple ID.
#
# Usage:
#   1. Push this repo to GitHub (public repo for free macOS runner minutes)
#   2. Go to Actions tab -> "Build iOS" -> "Run workflow"
#   3. Download the artifact (GemmaRAG.ipa)
#   4. Sign and install on iPad using Sideloadly on Windows
#
# NOTE: Code signing is disabled in this workflow on purpose.
# Sideloadly re-signs the app with your personal Apple ID certificate.

name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'GemmaRAG/**'
      - 'project.yml'

env:
  LLAMA_CPP_RELEASE: b8968

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama.cpp XCFramework
        run: |
          curl -L -o llama-xcframework.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/llama-${LLAMA_CPP_RELEASE}-xcframework.zip"
          unzip -q llama-xcframework.zip
          mv build-apple/llama.xcframework .
          rm -rf build-apple llama-xcframework.zip

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GemmaRAG.xcodeproj \
            -scheme GemmaRAG \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== SWIFT COMPILATION ERRORS =========="
            grep -E "error:|warning:" build.log | head -80
            echo "========== END ERRORS =========="
            exit $BUILD_EXIT
          fi

      - name: Package .app bundle
        run: |
          APP_PATH=$(find build -name "GemmaRAG.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: GemmaRAG.app not found in build output"
            find build -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GemmaRAG.ipa Payload
          ls -lh GemmaRAG.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaRAG-ipa
          path: GemmaRAG.ipa
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: iOS (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration: Release" >> $GITHUB_STEP_SUMMARY
          echo "- llama.cpp: ${LLAMA_CPP_RELEASE}" >> $GITHUB_STEP_SUMMARY
          echo "- Signing: Unsigned (use Sideloadly to sign)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the GemmaRAG-ipa artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Install Sideloadly on Windows (sideloadly.io)" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect iPad via USB" >> $GITHUB_STEP_SUMMARY
          echo "4. Open Sideloadly, select .ipa, enter Apple ID" >> $GITHUB_STEP_SUMMARY
          echo "5. App will be signed and installed on iPad" >> $GITHUB_STEP_SUMMARY
